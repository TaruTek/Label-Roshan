# TaruTek Observability View on a Raspberry Pi (nginx)
# Serves the page from /var/www/tarutek and forwards API calls to the TaruTek server.

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;          # always use https
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/tarutek.crt;
    ssl_certificate_key /etc/nginx/ssl/tarutek.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/tarutek;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # TaruTek API: the page calls /api_jsonrpc.php on the Pi, the Pi passes it on
    location = /api_jsonrpc.php {
        limit_except POST { deny all; }
        proxy_pass            https://ciq.tarutek.com/api_jsonrpc.php;
        proxy_set_header      Host ciq.tarutek.com;
        proxy_ssl_server_name on;
        proxy_ssl_name        ciq.tarutek.com;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_read_timeout    90s;
        client_max_body_size  2m;
    }

    # Optional: push alerts service from TaruTek_Mobile_App.zip (only if you run it on the Pi)
    # location /push/ {
    #     proxy_pass http://127.0.0.1:8085/;
    # }

    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";        # a new index.html shows up straight away
    }

    gzip on;
    gzip_types text/html application/javascript application/json application/manifest+json;
}
